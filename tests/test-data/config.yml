compare:
  baseline: ../tests/test-data/report-02/Benchmark-report-full.json
  target: ../tests/test-data/report-01/Benchmark-report-full.json
  formats: [json, markdown, console]
  thresholds:
    - thresholdMean: 1.5%
    - pattern: "DemoApi.*"
      thresholdMean: 10ms
    - thresholdAllocation: 10kb
    - pattern: "DemoApi.Controllers.CreateController.Create"
      thresholdAllocation: 5kb
