version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Keep all codeql-action sub-actions (init/autobuild/analyze) on the same version
      codeql-action:
        patterns:
          - "github/codeql-action*"
    assignees:
      - "NelsonBN"
    reviewers:
      - "NelsonBN"
    commit-message:
      prefix: "build"
      include: "scope"
    target-branch: "main"

  - package-ecosystem: "nuget"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "NelsonBN"
    reviewers:
      - "NelsonBN"
    commit-message:
      prefix: "build"
      include: "scope"
    target-branch: "main"

  - package-ecosystem: "dotnet-sdk"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "NelsonBN"
    reviewers:
      - "NelsonBN"
    commit-message:
      prefix: "build"
      include: "scope"
    target-branch: "main"
